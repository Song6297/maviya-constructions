<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&B - Project Fee Payment</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/styles-professional.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .header p {
            color: var(--gray);
            font-size: 0.875rem;
        }

        .price-box {
            background: var(--success-light);
            border: 1px solid var(--success);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .price {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--success);
        }

        .price-label {
            color: var(--success);
            font-weight: 600;
            font-size: 0.875rem;
        }

        .qr-section {
            background: var(--bg-light);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .qr-title {
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 0.75rem;
            font-size: 0.9375rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .qr-code {
            width: 140px;
            height: 140px;
            margin: 0 auto 0.75rem;
            background: white;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-code img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
        }

        .upi-id {
            background: white;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-sm);
            font-family: monospace;
            font-weight: 700;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid var(--border);
            font-size: 0.9375rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 0.375rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.9375rem;
            color: var(--dark);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-input[readonly] {
            background: var(--bg-light);
            color: var(--gray);
        }

        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.9375rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background var(--transition-base);
        }

        .submit-btn:hover {
            background: var(--primary-dark);
        }

        .submit-btn:disabled {
            background: var(--gray-light);
            cursor: not-allowed;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }

        .back-link:hover {
            color: var(--primary-dark);
        }

        .info-box {
            background: var(--info-light);
            border: 1px solid var(--info);
            border-radius: var(--radius-md);
            padding: 0.875rem;
            margin-top: 1rem;
            font-size: 0.8125rem;
            color: var(--info);
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .required {
            color: var(--error);
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="hub.html" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
        <div class="card">
            <div class="header">
                <h1><i class="fas fa-folder-plus"></i> Project Creation Fee</h1>
                <p>One-time fee per project for free users</p>
            </div>

            <div class="price-box">
                <div class="price">₹5</div>
                <div class="price-label">per project</div>
            </div>

            <div class="qr-section">
                <h3 class="qr-title"><i class="fas fa-qrcode"></i> Scan to Pay</h3>
                <div class="qr-code">
                    <img src="upi_qr.svg" alt="UPI QR"
                        onerror="this.src='upi_qr.png'; this.onerror=function(){this.parentElement.innerHTML='<div style=\'text-align:center;color:var(--gray);\'><i class=\'fas fa-qrcode\' style=\'font-size:2rem;\'></i><br>QR not found</div>';}">
                </div>
                <div class="upi-id"><i class="fas fa-at"></i> 6364630740@slc</div>
            </div>

            <form id="feeForm">
                <input type="hidden" id="projectId">
                <input type="hidden" id="projectName">

                <div class="form-group">
                    <label class="form-label">Project Name</label>
                    <input type="text" id="displayProjectName" class="form-input" readonly>
                </div>

                <div class="form-group">
                    <label class="form-label">UPI Transaction ID (UTR) <span class="required">*</span></label>
                    <input type="text" id="utr" class="form-input" placeholder="12-digit UTR number" required
                        minlength="10" maxlength="20">
                </div>

                <div class="form-group">
                    <label class="form-label">Payment Date <span class="required">*</span></label>
                    <input type="date" id="paymentDate" class="form-input" required>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <i class="fas fa-check-circle"></i> Submit Payment
                </button>
            </form>

            <div class="info-box">
                <i class="fas fa-info-circle"></i>
                <span><strong>Note:</strong> Your project will be activated within 24 hours after payment verification.
                    Premium users don't need to pay this fee.</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { doc, getDoc, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        let currentUser = null;

        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('projectId');
        const projectName = urlParams.get('projectName');

        document.getElementById('projectId').value = projectId || '';
        document.getElementById('projectName').value = projectName || '';
        document.getElementById('displayProjectName').value = projectName || 'New Project';
        document.getElementById('paymentDate').valueAsDate = new Date();

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;
        });

        document.getElementById('feeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

            try {
                await addDoc(collection(db, 'projectFeePayments'), {
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    userName: currentUser.displayName || currentUser.email.split('@')[0],
                    projectId: document.getElementById('projectId').value,
                    projectName: document.getElementById('projectName').value,
                    utr: document.getElementById('utr').value.trim(),
                    paymentDate: document.getElementById('paymentDate').value,
                    amount: 5,
                    status: 'PENDING',
                    verified: false,
                    submittedAt: serverTimestamp()
                });

                alert('Payment submitted! Your project will be activated after verification.');
                window.location.href = 'hub.html';
            } catch (error) {
                alert('Error: ' + error.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Submit Payment';
            }
        });
    </script>
</body>

</html>
