<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&B Admin - Payment Verification</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link href="css/styles-sidebar.css?v=10" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(180deg, #FFF9E6 0%, #E6F7FF 50%, #F0FFF4 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 900;
            color: var(--text);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-size: 0.875rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--blueprint-blue);
            color: white;
        }

        .btn-secondary {
            background: #E8F4F8;
            color: var(--blueprint-blue);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            border: 3px solid #E8F4F8;
        }

        .stat-card.pending {
            border-color: #FFB74D;
        }

        .stat-card.approved {
            border-color: #81C784;
        }

        .stat-card.rejected {
            border-color: #E57373;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 900;
            color: var(--text);
        }

        .stat-label {
            color: var(--text-light);
            font-weight: 600;
            font-size: 0.875rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .tab {
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            background: white;
            border: 3px solid #E8F4F8;
            color: var(--text-light);
            transition: all 0.3s;
        }

        .tab.active {
            border-color: var(--blueprint-blue);
            color: var(--blueprint-blue);
            background: var(--soft-blue);
        }

        .tab:hover {
            border-color: var(--blueprint-blue);
        }

        /* Payment Cards */
        .payments-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .payment-card {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            border: 3px solid #E8F4F8;
            transition: all 0.3s;
        }

        .payment-card:hover {
            border-color: var(--blueprint-blue);
        }

        .payment-card.pending {
            border-left: 6px solid #FFB74D;
        }

        .payment-card.approved {
            border-left: 6px solid #F7B500;
        }

        .payment-card.rejected {
            border-left: 6px solid #F44336;
        }

        .payment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .payment-user h3 {
            font-weight: 800;
            color: var(--text);
            font-size: 1.125rem;
        }

        .payment-user p {
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .payment-status {
            padding: 0.375rem 0.875rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .payment-status.pending {
            background: #FFF3E0;
            color: #E65100;
        }

        .payment-status.approved {
            background: #FFF8E1;
            color: #F7B500;
        }

        .payment-status.rejected {
            background: #FFEBEE;
            color: #C62828;
        }

        .payment-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
            padding: 1rem;
            background: #F8F9FA;
            border-radius: 12px;
        }

        .detail-item label {
            display: block;
            font-size: 0.6875rem;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: 700;
        }

        .detail-item span {
            font-weight: 800;
            color: var(--text);
            font-size: 0.9375rem;
        }

        .detail-item.utr span {
            font-family: monospace;
            color: var(--blueprint-blue);
        }

        .payment-actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 0.625rem 1.25rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            font-size: 0.875rem;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .action-btn.approve {
            background: #F7B500;
            color: white;
        }

        .action-btn.reject {
            background: #F44336;
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        /* Admin Check */
        .admin-check {
            background: #FFEBEE;
            border: 3px solid #F44336;
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            margin: 2rem 0;
        }

        .admin-check i {
            font-size: 3rem;
            color: #F44336;
            margin-bottom: 1rem;
        }

        .admin-check h2 {
            color: #C62828;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .admin-check p {
            color: #D32F2F;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .payment-details {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Admin - Payment Verification</h1>
            <div class="header-actions">
                <a href="hub.html" class="btn btn-secondary"><i class="fas fa-home"></i> Dashboard</a>
                <button class="btn btn-primary" onclick="loadPayments()"><i class="fas fa-sync"></i> Refresh</button>
            </div>
        </div>

        <!-- Admin Check Message -->
        <div id="adminCheck" class="admin-check" style="display: none;">
            <i class="fas fa-lock"></i>
            <h2>Access Denied</h2>
            <p>You don't have admin privileges to access this page.</p>
            <a href="hub.html" class="btn btn-primary" style="margin-top: 1rem;">Go to Dashboard</a>
        </div>

        <!-- Admin Content -->
        <div id="adminContent" style="display: none;">
            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card pending">
                    <div class="stat-value" id="pendingCount">0</div>
                    <div class="stat-label">⏳ Pending</div>
                </div>
                <div class="stat-card approved">
                    <div class="stat-value" id="approvedCount">0</div>
                    <div class="stat-label">✅ Approved</div>
                </div>
                <div class="stat-card rejected">
                    <div class="stat-value" id="rejectedCount">0</div>
                    <div class="stat-label">❌ Rejected</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalRevenue">₹0</div>
                    <div class="stat-label">💰 Total Revenue</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" data-status="PENDING">⏳ Pending</div>
                <div class="tab" data-status="APPROVED">✅ Approved</div>
                <div class="tab" data-status="REJECTED">❌ Rejected</div>
                <div class="tab" data-status="ALL">📋 All</div>
            </div>

            <!-- Payments List -->
            <div class="payments-list" id="paymentsList">
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>Loading payments...</h3>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './js/firebase-config.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { collection, query, orderBy, getDocs, doc, updateDoc, getDoc, serverTimestamp, Timestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Admin emails - ADD YOUR EMAIL HERE
        const ADMIN_EMAILS = ['sulaimaansong6297@gmail.com'];

        let currentUser = null;
        let allPayments = [];
        let currentFilter = 'PENDING';

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            currentUser = user;

            // Check if admin
            if (!ADMIN_EMAILS.includes(user.email)) {
                document.getElementById('adminCheck').style.display = 'block';
                return;
            }

            document.getElementById('adminContent').style.display = 'block';
            loadPayments();
        });

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.status;
                renderPayments();
            });
        });

        // Load payments
        window.loadPayments = async function () {
            try {
                const q = query(collection(db, 'premiumPayments'), orderBy('submittedAt', 'desc'));
                const snapshot = await getDocs(q);

                allPayments = [];
                snapshot.forEach(doc => {
                    allPayments.push({ id: doc.id, ...doc.data() });
                });

                updateStats();
                renderPayments();
            } catch (error) {
                console.error('Error loading payments:', error);
                document.getElementById('paymentsList').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Error loading payments</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        };

        function updateStats() {
            const pending = allPayments.filter(p => p.status === 'PENDING').length;
            const approved = allPayments.filter(p => p.status === 'APPROVED').length;
            const rejected = allPayments.filter(p => p.status === 'REJECTED').length;
            const revenue = allPayments.filter(p => p.status === 'APPROVED').reduce((sum, p) => sum + (p.amount || 199), 0);

            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('approvedCount').textContent = approved;
            document.getElementById('rejectedCount').textContent = rejected;
            document.getElementById('totalRevenue').textContent = `₹${revenue.toLocaleString()}`;
        }

        function renderPayments() {
            const filtered = currentFilter === 'ALL'
                ? allPayments
                : allPayments.filter(p => p.status === currentFilter);

            if (filtered.length === 0) {
                document.getElementById('paymentsList').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h3>No payments found</h3>
                        <p>No ${currentFilter.toLowerCase()} payments to show</p>
                    </div>
                `;
                return;
            }

            document.getElementById('paymentsList').innerHTML = filtered.map(payment => {
                const submittedDate = payment.submittedAt?.toDate?.()
                    ? payment.submittedAt.toDate().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
                    : 'Unknown';

                return `
                    <div class="payment-card ${payment.status.toLowerCase()}">
                        <div class="payment-header">
                            <div class="payment-user">
                                <h3>${payment.userName || 'Unknown User'}</h3>
                                <p>${payment.userEmail}</p>
                            </div>
                            <span class="payment-status ${payment.status.toLowerCase()}">${payment.status}</span>
                        </div>
                        
                        <div class="payment-details">
                            <div class="detail-item utr">
                                <label>UTR Number</label>
                                <span>${payment.utr}</span>
                            </div>
                            <div class="detail-item">
                                <label>Amount</label>
                                <span>₹${payment.amount || 199}</span>
                            </div>
                            <div class="detail-item">
                                <label>Payment Date</label>
                                <span>${payment.paymentDate}</span>
                            </div>
                            <div class="detail-item">
                                <label>UPI App</label>
                                <span>${payment.upiApp || 'Not specified'}</span>
                            </div>
                            <div class="detail-item">
                                <label>Submitted</label>
                                <span>${submittedDate}</span>
                            </div>
                            <div class="detail-item">
                                <label>User ID</label>
                                <span style="font-size: 0.75rem; word-break: break-all;">${payment.userId}</span>
                            </div>
                        </div>
                        
                        ${payment.status === 'PENDING' ? `
                            <div class="payment-actions">
                                <button class="action-btn approve" onclick="approvePayment('${payment.id}', '${payment.userId}')">
                                    <i class="fas fa-check"></i> Approve & Activate Premium
                                </button>
                                <button class="action-btn reject" onclick="rejectPayment('${payment.id}')">
                                    <i class="fas fa-times"></i> Reject
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Approve payment
        window.approvePayment = async function (paymentId, userId) {
            if (!confirm('Are you sure you want to APPROVE this payment and activate premium for 30 days?')) return;

            try {
                const now = new Date();
                const endDate = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000); // 30 days

                // Update payment status
                await updateDoc(doc(db, 'premiumPayments', paymentId), {
                    status: 'APPROVED',
                    verified: true,
                    verifiedAt: serverTimestamp(),
                    verifiedBy: currentUser.email,
                    premiumStart: Timestamp.fromDate(now),
                    premiumEnd: Timestamp.fromDate(endDate)
                });

                // Update user's premium status
                await updateDoc(doc(db, 'users', userId), {
                    premiumStatus: 'PREMIUM',
                    premiumStart: Timestamp.fromDate(now),
                    premiumEnd: Timestamp.fromDate(endDate)
                });

                alert('✅ Payment approved! User now has premium access for 30 days.');
                loadPayments();
            } catch (error) {
                console.error('Error approving payment:', error);
                alert('Error: ' + error.message);
            }
        };

        // Reject payment
        window.rejectPayment = async function (paymentId) {
            const reason = prompt('Enter rejection reason (optional):');
            if (reason === null) return; // Cancelled

            try {
                await updateDoc(doc(db, 'premiumPayments', paymentId), {
                    status: 'REJECTED',
                    verified: false,
                    verifiedAt: serverTimestamp(),
                    verifiedBy: currentUser.email,
                    rejectionReason: reason || 'Payment could not be verified'
                });

                alert('❌ Payment rejected.');
                loadPayments();
            } catch (error) {
                console.error('Error rejecting payment:', error);
                alert('Error: ' + error.message);
            }
        };
    </script>
</body>

</html>
