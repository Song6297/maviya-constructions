<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B&B - Status | Bricks & Bits</title>
    <link rel="icon" type="image/png" href="B&B.png">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/styles-professional.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: var(--bg-light); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .status-container { max-width: 600px; width: 100%; }
        .status-header { text-align: center; margin-bottom: 2rem; }
        .status-icon { width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; }
        .status-icon i { font-size: 2rem; color: white; }
        .status-title { font-size: 1.5rem; font-weight: 700; color: var(--dark); margin-bottom: 0.5rem; }
        .status-subtitle { color: var(--gray); font-size: 0.875rem; }
        .status-card { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 2rem; }
        .check-item { display: flex; align-items: center; justify-content: space-between; padding: 1rem; border-radius: var(--radius-md); margin-bottom: 0.75rem; background: var(--bg-light); }
        .check-item.success { background: var(--success-light); border: 1px solid var(--success); }
        .check-item.error { background: var(--error-light); border: 1px solid var(--error); }
        .check-item.loading { background: var(--bg-light); }
        .check-info { display: flex; align-items: center; gap: 0.75rem; }
        .check-info i { font-size: 1.25rem; }
        .check-info i.success { color: var(--success); }
        .check-info i.error { color: var(--error); }
        .check-info i.loading { color: var(--gray); }
        .check-name { font-weight: 600; color: var(--dark); font-size: 0.875rem; }
        .check-fix { font-size: 0.75rem; color: var(--gray); margin-top: 0.25rem; }
        .check-status { font-size: 0.75rem; font-weight: 700; }
        .check-status.success { color: var(--success); }
        .check-status.error { color: var(--error); }
        .info-box { padding: 1rem; background: var(--info-light); border: 1px solid var(--info); border-radius: var(--radius-md); margin-top: 1rem; }
        .info-box i { color: var(--info); margin-right: 0.5rem; }
        .info-box p { font-size: 0.8125rem; color: var(--dark); }
        .btn-group { display: flex; gap: 0.75rem; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
    </style>
</head>
<body>
    <div class="status-container">
        <div class="status-header">
            <div class="status-icon"><i class="fas fa-stethoscope"></i></div>
            <h1 class="status-title">System Status Check</h1>
            <p class="status-subtitle">Verify your setup is correct</p>
        </div>

        <div class="status-card">
            <div id="checks"></div>

            <div class="info-box">
                <p><i class="fas fa-info-circle"></i> Make sure to enable Phone Authentication and create Firestore database in Firebase Console.</p>
            </div>

            <div class="btn-group">
                <a href="login.html" class="btn btn-primary flex-1"><i class="fas fa-sign-in-alt"></i> Try Login</a>
                <a href="hub.html" class="btn btn-secondary flex-1"><i class="fas fa-home"></i> Go to Hub</a>
            </div>
        </div>
    </div>

    <script type="module">
        const checks = [
            { name: 'Server Running', test: () => window.location.protocol === 'http:' || window.location.protocol === 'https:', fix: 'Run: python3 -m http.server 8000' },
            { name: 'Firebase Config', test: async () => { try { const r = await fetch('./js/firebase-config.js'); return r.ok; } catch { return false; } }, fix: 'Check js/firebase-config.js exists' },
            { name: 'Auth Module', test: async () => { try { const r = await fetch('./js/auth.js'); return r.ok; } catch { return false; } }, fix: 'Check js/auth.js exists' },
            { name: 'Storage Module', test: async () => { try { const r = await fetch('./js/firebase-storage.js'); return r.ok; } catch { return false; } }, fix: 'Check js/firebase-storage.js exists' },
            { name: 'Professional Styles', test: async () => { try { const r = await fetch('./css/styles-professional.css'); return r.ok; } catch { return false; } }, fix: 'Check css/styles-professional.css exists' }
        ];

        const container = document.getElementById('checks');

        async function runChecks() {
            for (const check of checks) {
                const div = document.createElement('div');
                div.className = 'check-item loading';
                div.innerHTML = `
                    <div class="check-info">
                        <i class="fas fa-spinner fa-spin loading"></i>
                        <div><div class="check-name">${check.name}</div></div>
                    </div>
                    <span class="check-status">Checking...</span>
                `;
                container.appendChild(div);

                try {
                    const result = await check.test();
                    if (result) {
                        div.className = 'check-item success';
                        div.innerHTML = `
                            <div class="check-info">
                                <i class="fas fa-check-circle success"></i>
                                <div><div class="check-name">${check.name}</div></div>
                            </div>
                            <span class="check-status success">OK</span>
                        `;
                    } else {
                        div.className = 'check-item error';
                        div.innerHTML = `
                            <div class="check-info">
                                <i class="fas fa-exclamation-circle error"></i>
                                <div><div class="check-name">${check.name}</div><div class="check-fix">${check.fix}</div></div>
                            </div>
                            <span class="check-status error">FAILED</span>
                        `;
                    }
                } catch (error) {
                    div.className = 'check-item error';
                    div.innerHTML = `
                        <div class="check-info">
                            <i class="fas fa-times-circle error"></i>
                            <div><div class="check-name">${check.name}</div><div class="check-fix">${check.fix}</div></div>
                        </div>
                        <span class="check-status error">ERROR</span>
                    `;
                }
            }
        }

        runChecks();
    </script>
</body>
</html>
